name: Appcast

# Publishes the site on GitHub Pages: the landing page rendered from `site/` (site/build.mjs), and
# the Sparkle feed `appcast.xml` generated beside it (ADR 0033). A release changes both: the feed,
# and the download links and changelog of the page. The feed is recomputed in full from the
# published releases on every run, never edited: unpublishing or deleting a release takes it out,
# and a draft never enters it, since its assets are not even read.
#
# No secret here: the EdDSA signature of each archive is already in its `.appcast.json` asset,
# written by Scripts/release.sh in the protected `release` environment. This workflow can only
# point at archives that must still pass both the EdDSA and the Developer ID checks.
#
# A release event runs on the release's tag: its checkout, its `site/` and its generator would be
# the tag's, and the `github-pages` environment only deploys from `main`. So a release event only
# asks for a run of this workflow on `main`, which does the work.
#
# Once, in the repository: Settings → Pages → Source: GitHub Actions.
on:
  release:
    types: [published, unpublished, deleted, edited]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Packages/ReleaseTools/**"
      - "Scripts/publish-appcast.sh"
      - ".github/workflows/appcast.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and none cancelled halfway: the last one to start is the feed served.
concurrency:
  group: pages-${{ github.event_name == 'release' && 'dispatch' || 'deploy' }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run appcast.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.app

      # The landing page is rendered by site/build.mjs, which needs nothing but Node.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Generate the site and its feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/publish-appcast.sh "$RUNNER_TEMP/site"

      # On macOS, upload-pages-artifact archives the site with GNU tar.
      - name: Make sure GNU tar is installed
        run: command -v gtar >/dev/null || brew install gnu-tar

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    # Only this job may deploy: the build runs third-party code (the generator's dependencies).
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
